# OpenResty/Nginx 配置示例
# 用于正确处理 i18n 站点的 404 错误页面
#
# 将以下配置添加到你的 server 块中

server {
    listen 80;
    listen 443 ssl http2;
    server_name wenjiexu.site www.wenjiexu.site;
    
    # SSL 配置（如果使用 HTTPS）
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    
    # 网站根目录
    root /opt/1panel/apps/openresty/openresty/www/sites/wenjiexusite/index;
    index index.html;
    
    # 根路径协议级即时重定向（0ms 无感跳转）
    location = / {
        return 302 /zh_CN/;
    }

    # 404 错误页面配置
    error_page 404 /zh_CN/404/index.html;
    
    # 处理 /zh_CN/ 路径
    location ^~ /zh_CN/ {
        try_files $uri $uri/ /zh_CN/404/index.html;
    }
    
    # 处理 /en_US/ 路径
    location ^~ /en_US/ {
        try_files $uri $uri/ /en_US/404/index.html;
    }
    
    # 默认兜底处理
    location / {
        try_files $uri $uri/ /zh_CN/404/index.html;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
