name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆，提高速度

      - name: 服务器执行部署命令
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e  # 遇到错误立即退出
            cd /opt/1panel/www/sites/wenjiexusite/LandingPage

            # 配置安全目录
            git config --global --add safe.directory "$(pwd)"

            # 配置多源拉取（指定 gh-proxy.org 及其节点，带官方源兜底）
            MIRRORS=(
              "https://gh-proxy.org/https://github.com/Vncntvx/LandingPage"
              "https://v4.gh-proxy.org/https://github.com/Vncntvx/LandingPage"
              "https://v6.gh-proxy.org/https://github.com/Vncntvx/LandingPage"
              "https://axisnow.gh-proxy.org/https://github.com/Vncntvx/LandingPage"
              "https://github.com/Vncntvx/LandingPage"
            )

            PULL_SUCCESS=0
            for mirror in "${MIRRORS[@]}"; do
              echo "==> 尝试使用代码源: $mirror"
              git remote set-url origin "$mirror"
              if git fetch --depth=1 origin main; then
                PULL_SUCCESS=1
                break
              fi
              echo "⚠️ 当前源不可用，尝试下一个候选源..."
            done

            if [ "$PULL_SUCCESS" -ne 1 ]; then
              echo "❌ 所有代码源均拉取失败"
              exit 1
            fi

            git reset --hard origin/main

            # 设置 PATH 环境变量以包含 bun
            export PATH="/root/.bun/bin:$PATH"

            # 验证 bun 并尝试升级（修复旧版 Bun 1.3.3 解析 React 19 CommonJS 包装函数的已知 bug）
            which bun || echo "bun not found in PATH"
            bun upgrade || true

            # 安装依赖并构建（优先 Bun 构建，若旧版本异常则自动回退至 Node.js 容灾构建）
            bun install
            bun run build || node ./node_modules/.bin/astro build

            # 将 dist 文件夹内容移动到 index 目录
            rm -rf /opt/1panel/www/sites/wenjiexusite/index/*
            cp -r dist/* /opt/1panel/www/sites/wenjiexusite/index/

            # 设置index文件权限为 PHP-FPM 用户
            chown -R 1000:1000 /opt/1panel/www/sites/wenjiexusite/index

            echo "✅ 构建文件已移动到 index 目录"
            echo "✅ index 目录文件权限已设置为 1000:1000"
            echo "🚀 部署完成时间: $(date)"
